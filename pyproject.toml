[project]
name = "vanedb-cpp"
version = "0.1.0"
description = "Supplementary C++ Python bindings for VaneDB"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Anton Tsvetkov"}
]
keywords = ["vector", "database", "embedding", "hnsw", "similarity-search", "machine-learning"]
dependencies = ["numpy>=1.24"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["scikit-build-core>=0.4.3", "pybind11>=3.1"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.exclude = ["include/**", "lib/**"]

[tool.scikit-build.cmake.define]
VANEDB_BUILD_TESTS = "OFF"
VANEDB_BUILD_BENCHMARKS = "OFF"
VANEDB_BUILD_EXAMPLES = "OFF"
VANEDB_BUILD_PYTHON = "ON"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
